<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>四级作文翻译助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f0f7ff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 1rem; color: #1e2a3a; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        h1 { font-size: 1.8rem; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .sub { color: #5a6e85; font-size: 0.9rem; margin-bottom: 1rem; border-left: 3px solid #0077ff; padding-left: 0.75rem; }
        .mode-buttons { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .mode-btn { background: #eef2f6; border: none; padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
        .mode-btn.active { background: #0077ff; color: white; }
        textarea { width: 100%; padding: 1rem; font-size: 1rem; border: 1px solid #cbdde9; border-radius: 1rem; font-family: inherit; resize: vertical; min-height: 150px; }
        button { background: #0077ff; color: white; border: none; padding: 0.8rem 1.5rem; font-size: 1rem; border-radius: 2rem; font-weight: 500; cursor: pointer; margin-top: 0.8rem; width: 100%; }
        button:disabled { background: #b0c4de; cursor: not-allowed; }
        .result { background: #f8fafc; border-radius: 1rem; padding: 1.2rem; white-space: pre-wrap; line-height: 1.5; }
        .donate { text-align: center; margin-top: 1rem; padding: 1rem; background: #fff7e5; border-radius: 1rem; }
        .donate img { max-width: 180px; margin-top: 0.5rem; border-radius: 0.5rem; }
        footer { text-align: center; font-size: 0.7rem; color: #8ba0b5; margin-top: 2rem; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 2px solid #e2e8f0; border-top-color: #0077ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .input-label { font-weight: 500; margin-bottom: 0.5rem; color: #1e2a3a; }
        .warning { color: #e67e22; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>✍️ 四级作文·翻译助手</h1>
        <div class="sub">批改 · 指导 · 翻译 | 完全免费</div>

        <!-- 模式切换 -->
        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="correct">📝 作文批改</button>
            <button class="mode-btn" data-mode="guide">🎯 作文指导</button>
            <button class="mode-btn" data-mode="translate">🌍 翻译练习</button>
        </div>

        <!-- 动态输入区 -->
        <div id="inputArea">
            <div class="input-label" id="inputLabel">✏️ 粘贴你的英文作文</div>
            <!-- 作文题目输入框（仅在批改模式显示） -->
            <div id="topicField" style="margin-bottom: 12px; display: none;">
                <input type="text" id="topicInput" placeholder="请输入作文题目（例如：The Importance of Exercise）" style="width: 100%; padding: 8px; border-radius: 0.8rem; border: 1px solid #cbdde9; font-size: 0.9rem;">
            </div>
            <textarea id="essayInput" placeholder="粘贴你的英文作文..."></textarea>
            <!-- 单词数统计 -->
            <div id="wordCount" style="text-align: right; font-size: 0.8rem; margin-top: 4px;"></div>
        </div>
        <button id="submitBtn">开始处理</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>📌 结果</h2>
        <div id="resultContent" class="result"></div>
    </div>

    <div id="donateBox" style="display: none;" class="donate">
        <p>☕️ 如果这个工具帮到了你，请作者喝杯咖啡~</p>
        <img id="donateQr" src="" alt="收款码" style="width: 180px;">
    </div>
    <footer>AI生成内容仅供参考，结合自身判断。</footer>
</div>

<script>
    let currentMode = "correct"; // correct, guide, translate
    const modeBtns = document.querySelectorAll('.mode-btn');
    const inputLabel = document.getElementById('inputLabel');
    const textarea = document.getElementById('essayInput');
    const topicField = document.getElementById('topicField');
    const topicInput = document.getElementById('topicInput');
    const wordCountDiv = document.getElementById('wordCount');
    const submitBtn = document.getElementById('submitBtn');
    const resultCard = document.getElementById('resultCard');
    const resultContent = document.getElementById('resultContent');
    const donateBox = document.getElementById('donateBox');

    const DONATE_IMAGE_URL = ""; // 你的收款码链接，可留空

    if (DONATE_IMAGE_URL) {
        document.getElementById('donateQr').src = DONATE_IMAGE_URL;
        donateBox.style.display = 'block';
    }

    // 计算单词数（简单按空格分割）
    function countWords(text) {
        return text.trim().split(/\s+/).filter(word => word.length > 0).length;
    }

    // 更新单词统计显示
    function updateWordCount() {
        const text = textarea.value;
        const wordCount = countWords(text);
        if (wordCount === 0) {
            wordCountDiv.innerHTML = '';
            wordCountDiv.className = '';
            return;
        }
        let message = `单词数: ${wordCount}`;
        let className = '';
        if (currentMode === 'correct') {
            if (wordCount < 120) {
                message += ' ⚠️ 建议至少120词';
                className = 'warning';
            } else if (wordCount > 180) {
                message += ' ⚠️ 建议不超过180词';
                className = 'warning';
            } else {
                message += ' ✓ 符合要求(120-180)';
                className = '';
            }
        }
        wordCountDiv.innerHTML = message;
        wordCountDiv.className = className;
    }

    // 切换模式逻辑
    function updateModeUI() {
        if (currentMode === 'correct') {
            inputLabel.innerText = '✏️ 请输入作文题目和英文作文';
            textarea.placeholder = '粘贴英文作文...';
            topicField.style.display = 'block';
        } else if (currentMode === 'guide') {
            inputLabel.innerText = '📖 输入作文题目（中文或英文）';
            textarea.placeholder = '例：写一封建议信，内容是给朋友推荐一本书。';
            topicField.style.display = 'none';
        } else {
            inputLabel.innerText = '🌐 输入中文句子，帮你翻译成英文';
            textarea.placeholder = '例：随着互联网的发展，越来越多的人喜欢在网上购物。';
            topicField.style.display = 'none';
        }
        // 清空之前结果和输入
        resultCard.style.display = 'none';
        textarea.value = '';
        if (topicInput) topicInput.value = '';
        updateWordCount();
    }

    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');
            updateModeUI();
        });
    });

    // 监听作文输入，实时更新单词统计
    textarea.addEventListener('input', updateWordCount);

    async function callAPI(essay, mode, topic) {
        let body = { essay, mode };
        if (mode === 'correct' && topic && topic.trim() !== '') {
            body.topic = topic.trim();
        }
        const response = await fetch('/api/correct', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || '服务器错误');
        }
        const data = await response.json();
        return data.result;
    }

    submitBtn.addEventListener('click', async () => {
        const content = textarea.value.trim();
        if (!content) {
            alert('请输入内容');
            return;
        }
        // 批改模式下检查单词数（仅提醒，不阻止提交）
        if (currentMode === 'correct') {
            const wordCount = countWords(content);
            if (wordCount < 120) {
                if (!confirm(`当前单词数 ${wordCount}，建议120-180词。是否仍要提交？`)) return;
            } else if (wordCount > 180) {
                if (!confirm(`当前单词数 ${wordCount}，建议120-180词。是否仍要提交？`)) return;
            }
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span> AI处理中...';

        try {
            let topic = null;
            if (currentMode === 'correct') {
                topic = topicInput.value;
            }
            const result = await callAPI(content, currentMode, topic);
            resultContent.innerHTML = result.replace(/\n/g, '<br>');
            resultCard.style.display = 'block';
        } catch (err) {
            alert('处理失败：' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '开始处理';
        }
    });

    // 初始化UI
    updateModeUI();
</script>
</body>
</html>
