<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>四六级作文批改助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0f7ff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
            color: #1e2a3a;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sub {
            color: #5a6e85;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            border-left: 3px solid #0077ff;
            padding-left: 0.75rem;
        }
        textarea {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            border: 1px solid #cbdde9;
            border-radius: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 200px;
        }
        button {
            background: #0077ff;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.8rem;
            width: 100%;
        }
        button:disabled {
            background: #b0c4de;
            cursor: not-allowed;
        }
        .result {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1.2rem;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .donate {
            text-align: center;
            margin-top: 1rem;
            padding: 1rem;
            background: #fff7e5;
            border-radius: 1rem;
        }
        .donate img {
            max-width: 180px;
            margin-top: 0.5rem;
            border-radius: 0.5rem;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #8ba0b5;
            margin-top: 2rem;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-top-color: #0077ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>✍️ 四六级作文批改助手</h1>
        <div class="sub">完全免费 · AI 帮你找语法错误 · 词汇升级 · 评分</div>
        <textarea id="essayInput" placeholder="粘贴你的英文作文..."></textarea>
        <button id="submitBtn">开始批改</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>📝 批改结果</h2>
        <div id="resultContent" class="result"></div>
    </div>

    <!-- 打赏区（可选，不放图片则不会显示） -->
    <div id="donateBox" style="display: none;" class="donate">
        <p>☕️ 如果这个工具帮到了你</p>
        <p>请作者喝杯咖啡，鼓励我继续维护~</p>
        <img id="donateQr" src="" alt="收款码" style="width: 180px;">
    </div>
    <footer>AI生成结果仅供参考，请结合自身判断。</footer>
</div>

<script>
    const submitBtn = document.getElementById('submitBtn');
    const essayInput = document.getElementById('essayInput');
    const resultCard = document.getElementById('resultCard');
    const resultContent = document.getElementById('resultContent');
    const donateBox = document.getElementById('donateBox');

    // 如果你想显示打赏码，把图片URL填在这里（例如图床地址）
    // 暂时留空则打赏区不显示
    const DONATE_IMAGE_URL = "";  // 改成你的收款码图片链接

    if (DONATE_IMAGE_URL) {
        document.getElementById('donateQr').src = DONATE_IMAGE_URL;
        donateBox.style.display = 'block';
    }

    async function callAPI(essay) {
        const response = await fetch('/api/correct', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ essay })
        });
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || '服务器错误');
        }
        const data = await response.json();
        return data.result;
    }

    submitBtn.addEventListener('click', async () => {
        const essay = essayInput.value.trim();
        if (!essay) {
            alert('请先输入作文内容');
            return;
        }
        if (essay.split(/\s+/).length < 10) {
            alert('建议字数不少于10个单词，批改效果更好');
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span> AI批改中（约10秒）...';

        try {
            const result = await callAPI(essay);
            resultContent.innerHTML = result.replace(/\n/g, '<br>');
            resultCard.style.display = 'block';
        } catch (err) {
            alert('批改失败：' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '开始批改';
        }
    });
</script>
</body>
</html>
